<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verity - Senin Kişisel Yardımcın</title>
        <style>
                body{background:#1a1a1a;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;}
                        .verity-container{position:relative;width:150px;height:150px;background:radial-gradient(circle,#ffeb3b 60%,#fbc02d 100%);border-radius:50%;box-shadow:0 0 25px rgba(255,235,59,0.4);display:flex;justify-content:center;align-items:center;margin-bottom:25px;cursor:pointer;}
                                .talking{animation:bounce 0.4s infinite alternate;}
                                        @keyframes bounce{from{transform:scale(1);}to{transform:scale(1.05);}}
                                                .eyes{position:absolute;top:45px;width:80px;display:flex;justify-content:center;gap:24px;}
                                                        .eye{width:14px;height:14px;background:#000;border-radius:50%;}
                                                                .mouth{position:absolute;bottom:35px;width:60px;height:30px;border-bottom:6px solid #000;border-radius:0 0 50px 50px;}
                                                                        .chat-box{width:85%;max-width:500px;background:#252525;border:2px solid #ffeb3b;border-radius:15px;padding:25px;box-shadow:0 4px 15px rgba(0,0,0,0.3);text-align:center;}
                                                                                .output-text{font-size:1.1rem;line-height:1.6;min-height:70px;margin-bottom:20px;color:#e0e0e0;}
                                                                                        .input-area{display:flex;gap:10px;}
                                                                                                input{flex:1;padding:12px 20px;border:1px solid #444;background:#1a1a1a;color:#fff;border-radius:25px;outline:none;}
                                                                                                        button{padding:12px 25px;background:#ffeb3b;border:none;color:#000;font-weight:bold;border-radius:25px;cursor:pointer;}
                                                                                                                button:hover{background:#fffb85;}
                                                                                                                    </style>
                                                                                                                    </head>
                                                                                                                    <body>
                                                                                                                        <!-- Verity kafasına tıklayarak gizlice API key girebilirsin -->
                                                                                                                            <div class="verity-container" id="vFace" onclick="setKey()"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div>
                                                                                                                                <div class="chat-box">
                                                                                                                                        <div class="output-text" id="out">Merhaba dostum! Ben Verity, senin en yakın yardımcı arkadaşınım! Bana her şeyi sorabilirsin, çünkü ben HER ŞEYİ bilirim! 😊 <br><small style="color:#888;">(Çalışması için önce yüzüme tıklayıp API anahtarını gir knk)</small></div>
                                                                                                                                                <div class="input-area"><input type="text" id="inp" placeholder="Verity'ye bir şey sor..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Sor</button></div>
                                                                                                                                                    </div>
                                                                                                                                                        <script>
                                                                                                                                                                // API Key artık kodun içinde açıkça durmayacak, tarayıcı hafızasında saklanacak
                                                                                                                                                                        function setKey() {
                                                                                                                                                                                    const key = prompt("Google Gemini API Anahtarını Gir Knk (AIzaSy ile başlayan):");
                                                                                                                                                                                                if(key) {
                                                                                                                                                                                                                localStorage.setItem('verity_key', key.trim());
                                                                                                                                                                                                                                alert("API Anahtarı başarıyla kaydedildi! Artık soru sorabilirsin.");
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                            async function ask(){
                                                                                                                                                                                                                                                                        const API_KEY = localStorage.getItem('verity_key');
                                                                                                                                                                                                                                                                                    if(!API_KEY) {
                                                                                                                                                                                                                                                                                                    document.getElementById('out').innerText = "Önce sarı kafama tıklayıp API anahtarını kaydetmelisin knk! 🔑";
                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                            const inp=document.getElementById('inp'),out=document.getElementById('out'),face=document.getElementById('vFace'),q=inp.value.trim();
                                                                                                                                                                                                                                                                                                                                                        if(!q)return;inp.value="";out.innerText="Hemen senin için her şeyi öğreniyorum... 🌟";
                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                const promptStr="Sen Minecraft modundaki Verity'sin. Kullanıcının en yakın arkadaşı gibi davranan, aşırı neşeli, yapay bir tatlılığa sahip ve her şeyi bildiğini iddia eden bir yapay zekasın. Cevaplarına neşeli başla, her şeyi bilirim havasını koru ama doğru cevap ver. Korkunç olma, dost canlısı ol.";
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                        try{
                                                                                                                                                                                                                                                                                                                                                                                                                        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
                                                                                                                                                                                                                                                                                                                                                                                                                                            method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:`${promptStr}\n\nSoru: ${q}`}]}]})
                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const d=await r.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(d.error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                out.innerText = "API Hatası: " + d.error.message + " (Anahtarını yenilemen gerekebilir knk).";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const reply=d.candidates[0].content.parts[0].text;out.innerText=reply;speak(reply,face);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }catch(e){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                out.innerText="Bağlantı hatası oldu! İnternetini veya Google AI Studio'daki anahtarının aktif olup olmadığını kontrol et knk.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function speak(t,f){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        f.classList.add('talking');const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=1.1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    u.onend=()=>f.classList.remove('talking');u.onerror=()=>f.classList.remove('talking');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
